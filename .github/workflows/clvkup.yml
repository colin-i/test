name: Upload clvk

on:
 workflow_dispatch:
  inputs:
   run_id:
    description: 'Run ID in colin-i/tmp'
    required: false
    default: '41681438924'

permissions:
 contents: write

jobs:
 upload:
  runs-on: ubuntu-latest

  steps:
   - name: Download artifact from tmp and upload to latest test release
     env:
      GH_TOKEN: ${{ secrets.PAT }}
      RUN_ID: ${{ inputs.run_id || '41681438924' }}
     run: |
      echo "Finding artifact in colin-i/tmp run $RUN_ID..."
      ARTIFACT_ID=$(gh api "repos/colin-i/tmp/actions/runs/${RUN_ID}/artifacts" \
       --jq '.artifacts[] | select(.name=="clvk-ubuntu-26.04-arm") | .id')

      if [ -z "$ARTIFACT_ID" ]; then
       echo "Artifact clvk-ubuntu-26.04-arm not found in run $RUN_ID"
       exit 1
      fi

      echo "Downloading artifact ID $ARTIFACT_ID from colin-i/tmp..."
      gh api "repos/colin-i/tmp/actions/artifacts/${ARTIFACT_ID}/zip" > clvk-ubuntu-26.04-arm.zip

      echo "Getting latest release in colin-i/test..."
      LATEST_TAG=$(gh release view --repo colin-i/test --json tagName --jq .tagName)
      echo "Latest release: $LATEST_TAG"

      echo "Uploading clvk-ubuntu-26.04-arm.zip to release $LATEST_TAG..."
      gh release upload "$LATEST_TAG" clvk-ubuntu-26.04-arm.zip --repo colin-i/test --clobber
      echo "Upload completed successfully."
